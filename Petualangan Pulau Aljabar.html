<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petualangan Pulau Aljabar - Game SPLDV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #ffffff;
      background: linear-gradient(135deg, #0f8bd6 0%, #23c6b8 45%, #f7d774 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 90%, rgba(255, 241, 118, 0.5) 0 80px, transparent 82px),
        radial-gradient(circle at 80% 85%, rgba(39, 174, 96, 0.38) 0 110px, transparent 112px),
        radial-gradient(circle at 50% 105%, rgba(255, 255, 255, 0.22) 0 140px, transparent 142px);
      pointer-events: none;
      z-index: 0;
    }

    .math-symbol {
      position: fixed;
      color: rgba(255, 255, 255, 0.34);
      font-size: 2.2rem;
      font-weight: 800;
      animation: floatSymbol 8s ease-in-out infinite;
      z-index: 1;
      user-select: none;
    }

    .s1 { top: 8%; left: 8%; animation-delay: 0s; }
    .s2 { top: 18%; right: 12%; animation-delay: 1.2s; }
    .s3 { top: 48%; left: 4%; animation-delay: 2.4s; }
    .s4 { bottom: 18%; right: 7%; animation-delay: 3.2s; }
    .s5 { bottom: 8%; left: 22%; animation-delay: 4.1s; }
    .s6 { top: 36%; right: 28%; animation-delay: 5s; }

    @keyframes floatSymbol {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.25; }
      50% { transform: translateY(-22px) rotate(8deg); opacity: 0.55; }
    }

    .app {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 42px;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
      animation: fadeIn 0.7s ease;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.7rem);
      text-shadow: 0 5px 16px rgba(0, 70, 120, 0.28);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.05rem;
      opacity: 0.95;
      max-width: 830px;
      margin: auto;
      line-height: 1.55;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 22px 0;
    }

    .progress-wrap, .score-box {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow: 0 12px 30px rgba(5, 70, 90, 0.18);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 14px 16px;
    }

    .progress-title {
      font-size: 0.92rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .progress-track {
      height: 14px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.28);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fff176, #66ff99);
      border-radius: inherit;
      transition: width 0.45s ease;
    }

    .score-box {
      min-width: 155px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .island-map {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .island-dot {
      border-radius: 22px;
      padding: 12px 8px;
      text-align: center;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      opacity: 0.58;
      transition: 0.25s ease;
      font-size: 0.9rem;
    }

    .island-dot.active {
      opacity: 1;
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.34);
      box-shadow: 0 12px 26px rgba(0, 74, 109, 0.18);
    }

    .island-dot.done {
      opacity: 1;
      background: rgba(46, 204, 113, 0.33);
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 18px 42px rgba(0, 72, 100, 0.22);
      backdrop-filter: blur(18px);
      border-radius: 30px;
      padding: clamp(20px, 4vw, 34px);
      animation: slideIn 0.45s ease;
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 99px;
      background: rgba(0, 79, 117, 0.28);
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h2 {
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      margin-bottom: 12px;
    }

    h3 {
      font-size: 1.15rem;
      margin: 18px 0 10px;
      color: #fffde7;
    }

    p, li {
      line-height: 1.62;
      font-size: 1rem;
    }

    .story-box {
      margin: 15px 0;
      padding: 16px;
      border-radius: 20px;
      background: rgba(0, 91, 125, 0.22);
      border-left: 6px solid #fff176;
    }

    .learning-path {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .path-item {
      padding: 8px 11px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.32);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    button, .choice-btn {
      border: 0;
      cursor: pointer;
      color: #06485c;
      background: linear-gradient(135deg, #ffffff, #d8fff6);
      padding: 13px 16px;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(0, 72, 100, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      text-align: left;
    }

    button:hover, .choice-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 14px 28px rgba(0, 72, 100, 0.26);
      filter: brightness(1.05);
    }

    .primary-btn {
      text-align: center;
      background: linear-gradient(135deg, #fff176, #ffcc66);
      margin-top: 18px;
    }

    .secondary-btn {
      text-align: center;
      background: linear-gradient(135deg, #d8fff6, #ffffff);
      margin-top: 10px;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      font-weight: 800;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .feedback.correct {
      display: block;
      background: rgba(46, 204, 113, 0.92);
      color: #063b24;
    }

    .feedback.wrong {
      display: block;
      background: rgba(255, 99, 99, 0.92);
      color: #4b0606;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    label {
      font-weight: 800;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      outline: none;
      color: #06485c;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.88);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.92rem;
      opacity: 0.92;
    }

    .hidden {
      display: none !important;
    }

    .summary-list {
      margin: 12px 0 0 18px;
    }

    .final-card {
      text-align: center;
    }

    $1

    .score-recap {
      margin-top: 18px;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .recap-row {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.32);
    }

    .recap-row strong {
      color: #fffde7;
    }

    .recap-total {
      margin-top: 16px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(46, 204, 113, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.38);
      font-weight: 800;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 780px) {
      .top-bar, .input-grid {
        grid-template-columns: 1fr;
      }

      .island-map {
        grid-template-columns: 1fr;
      }

      .island-dot {
        text-align: left;
      }
    }
  </style>
</head>

  <span class="math-symbol s1">x</span>

  <main class="app">
    <header>
      <h1>🏝️ Petualangan Pulau Aljabar</h1>
      <p class="subtitle">
        Jelajahi lima pulau SPLDV! Kamu akan mengamati masalah, bertanya, mengumpulkan informasi, menalar, lalu mengomunikasikan hasil seperti penjelajah matematika sejati.
      </p>
    </header>

    <section class="top-bar">
      <div class="progress-wrap">
        <div class="progress-title" id="progressText">Kemajuan: 0%</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="score-box">Skor: <span id="score">0</span></div>
    </section>

    <section class="island-map" id="islandMap"></section>

    <section class="card" id="gameCard">
      <div class="badge" id="levelBadge">Pulau 1 • Orientasi Masalah • C3</div>
      <h2 id="levelTitle">Pasar Kerang</h2>
      <div class="learning-path" id="learningPath"></div>
      <div class="story-box" id="storyBox"></div>
      <div id="stepContent"></div>
      <div class="feedback" id="feedbackBox"></div>
      <button class="primary-btn hidden" id="nextStepBtn" onclick="nextStep()">Lanjut ke tahap berikutnya ➜</button>
      <button class="primary-btn hidden" id="nextLevelBtn" onclick="nextLevel()">Kamu berhasil menyelesaikan pulau ini! Lanjut ➜</button>
      <button class="secondary-btn hidden" id="restartBtn" onclick="restartGame()">Main Lagi dari Awal</button>
    </section>
  </main>

    var currentStep = 0;
    var answered = false;

      {

    function initGame() {
      buildMap();
      renderLevel();
      updateScore();
      updateProgress();
    }

    function buildMap() {
      var map = document.getElementById("islandMap");
      map.innerHTML = "";
      for (var i = 0; i < levels.length; i++) {
        var div = document.createElement("div");
        div.className = "island-dot";
        div.id = "islandDot" + i;
        div.innerHTML = "🏝️ Pulau " + (i + 1) + "<br><strong>" + shortTitle(i) + "</strong>";
        map.appendChild(div);
      }
    }

    function shortTitle(index) {
      var names = ["Orientasi", "Strategi", "Penyelidikan", "Hasil", "Kreasi"];
      return names[index];
    }

    function renderLevel() {
      answered = false;
      var level = levels[currentLevel];
      document.getElementById("levelBadge").innerText = level.badge;
      document.getElementById("levelTitle").innerText = level.title;
      document.getElementById("storyBox").innerHTML = "<strong>Misi:</strong> " + level.story;
      document.getElementById("feedbackBox").className = "feedback";
      document.getElementById("feedbackBox").innerText = "";
      document.getElementById("nextStepBtn").classList.add("hidden");
      document.getElementById("nextLevelBtn").classList.add("hidden");
      document.getElementById("restartBtn").classList.add("hidden");

      var path = document.getElementById("learningPath");
      path.innerHTML = "";
      for (var i = 0; i < level.path.length; i++) {
        var span = document.createElement("span");
        span.className = "path-item";
        span.innerText = level.path[i];
        path.appendChild(span);
      }

      updateMap();
      renderStep();
    }

    function renderStep() {
      answered = false;
      var level = levels[currentLevel];
      var step = level.steps[currentStep];
      var content = document.getElementById("stepContent");
      document.getElementById("feedbackBox").className = "feedback";
      document.getElementById("feedbackBox").innerText = "";
      document.getElementById("nextStepBtn").classList.add("hidden");
      document.getElementById("nextLevelBtn").classList.add("hidden");

      if (step.type === "choice") {
        var html = "<h3>Langkah " + (currentStep + 1) + " dari " + level.steps.length + "</h3>";
        html += "<p>" + step.question + "</p>";
        html += "<div class='choices'>";
        for (var i = 0; i < step.choices.length; i++) {
          html += "<button class='choice-btn' onclick='checkChoice(" + i + ")'>" + step.choices[i] + "</button>";
        }
        html += "</div>";
        html += "<p class='hint'>Petunjuk berpikir: baca informasi, hubungkan dengan persamaan, lalu pilih alasan yang paling logis.</p>";
        content.innerHTML = html;
      }

      if (step.type === "creation") {
        content.innerHTML =
          "<h3>Langkah Kreasi</h3>" +
          "<p>" + step.question + "</p>" +
          "<div class='input-grid'>" +
          "<div><label for='studentProblem'>Soal kontekstual buatanmu</label><textarea id='studentProblem' placeholder='Contoh: Di kantin, 2 nasi dan 1 es teh ...'></textarea></div>" +
          "<div><label for='studentEquations'>Model SPLDV</label><textarea id='studentEquations' placeholder='Contoh: 2x + y = 17000 dan x + 2y = 16000'></textarea></div>" +
          "<div><label for='studentX'>Nilai x</label><input id='studentX' type='text' placeholder='Contoh: 6000'></div>" +
          "<div><label for='studentY'>Nilai y</label><input id='studentY' type='text' placeholder='Contoh: 5000'></div>" +
          "</div>" +
          "<h3>Refleksi Berpikir</h3>" +
          "<textarea id='studentReflection' placeholder='Jelaskan bagaimana kamu menentukan variabel, membuat persamaan, dan menemukan solusi.'></textarea>" +
          "<button class='primary-btn' onclick='checkCreation()'>Kirim Karya SPLDV-ku ✨</button>" +
          "<p class='hint'>Kriteria sukses: ada cerita, ada dua persamaan, ada solusi x dan y, serta ada refleksi proses berpikir.</p>";
      }
    }

    function checkChoice(choiceIndex) {
      if (answered) return;
      var step = levels[currentLevel].steps[currentStep];
      var feedback = document.getElementById("feedbackBox");
      if (choiceIndex === step.answer) {
        answered = true;
        score += 10;
        islandScores[currentLevel] += 10;
        updateScore();
        feedback.className = "feedback correct";
        feedback.innerText = step.success + " +10 poin! Lanjut ke tantangan berikutnya!";
      } else {
        answered = true;
        feedback.className = "feedback wrong";
        feedback.innerText = step.fail + " Tidak mendapat poin, tetapi kamu tetap bisa lanjut ke soal berikutnya.";
      }

      showNextButton();
    }

    function checkCreation() {
      var problem = document.getElementById("studentProblem").value.trim();
      var equations = document.getElementById("studentEquations").value.trim();
      var xVal = document.getElementById("studentX").value.trim();
      var yVal = document.getElementById("studentY").value.trim();
      var reflection = document.getElementById("studentReflection").value.trim();
      var feedback = document.getElementById("feedbackBox");

      if (problem.length > 15 && equations.length > 10 && xVal !== "" && yVal !== "" && reflection.length > 20) {
        if (!answered) {
          score += 20;
          answered = true;
          updateScore();
        }
        feedback.className = "feedback correct";
        feedback.innerText = "Hebat! Kamu berhasil membuat soal SPLDV sendiri dan mengomunikasikan proses berpikirmu.";
        showNextButton();
      } else {
        feedback.className = "feedback wrong";
        feedback.innerText = "Coba lagi. Lengkapi cerita, model SPLDV, solusi x dan y, serta refleksi yang menjelaskan proses berpikirmu.";
      }
    }

    function showNextButton() {
      var level = levels[currentLevel];
      if (currentStep < level.steps.length - 1) {
        document.getElementById("nextStepBtn").classList.remove("hidden");
      } else {
        if (currentLevel < levels.length - 1) {
          document.getElementById("nextLevelBtn").classList.remove("hidden");
        } else {
          showFinal();
        }
      }
    }

    function nextStep() {
      currentStep++;
      renderStep();
      updateProgress();
    }

    function nextLevel() {
      currentLevel++;
      currentStep = 0;
      renderLevel();
      updateProgress();
    }

    function showFinal() {
      updateProgress(true);
      updateMap(true);
      var maxScore = calculateMaxScore();
      var percentScore = Math.round((score / maxScore) * 100);
      var predicate = getPredicate(percentScore);
      var recapHtml = buildScoreRecap(maxScore, percentScore, predicate);

      document.getElementById("levelBadge").innerText = "Misi Selesai • Evaluasi Akhir";
      document.getElementById("levelTitle").innerText = "Peti Harta Karun Aljabar Terbuka!";
      document.getElementById("storyBox").innerHTML = "<strong>Selamat!</strong> Kamu sudah menyelesaikan seluruh petualangan SPLDV dengan proses PBL dan konstruktivisme.";
      document.getElementById("learningPath").innerHTML = "";
      document.getElementById("stepContent").innerHTML =
        "<div class='final-card'>" +
        "<div class='treasure'>💎🏆💎</div>" +
        "<h3>Hebat! Skor akhirmu: " + score + " dari " + maxScore + "</h3>" +
        "<p>Kamu telah mengidentifikasi masalah, membuat model persamaan, memilih strategi, menyelesaikan SPLDV, menganalisis kesalahan, membandingkan metode, dan mengevaluasi proses berpikir.</p>" +
        recapHtml +
        "<ul class='summary-list'>" +
        "<li><strong>Berpikir kritis:</strong> memilih informasi penting dan strategi efektif.</li>" +
        "<li><strong>Berpikir analitis:</strong> memeriksa langkah dan menemukan kesalahan.</li>" +
        "<li><strong>Berpikir kreatif:</strong> menyusun ide soal dan model SPLDV.</li>" +
        "</ul>" +
        "</div>";
      document.getElementById("feedbackBox").className = "feedback correct";
      document.getElementById("feedbackBox").innerText = "Kamu berhasil menyelesaikan pulau ini dan seluruh petualangan!";
      document.getElementById("nextStepBtn").classList.add("hidden");
      document.getElementById("nextLevelBtn").classList.add("hidden");
      document.getElementById("restartBtn").classList.remove("hidden");
    }

    function calculateMaxScore() {
      var total = 0;
      for (var i = 0; i < levels.length; i++) {
        total += levels[i].steps.length * 10;
      }
      return total;
    }

    function buildScoreRecap(maxScore, percentScore, predicate) {
      var html = "<h3>📊 Rekap Skor Per Pulau</h3><div class='score-recap'>";
      for (var i = 0; i < levels.length; i++) {
        var islandMax = levels[i].steps.length * 10;
        html += "<div class='recap-row'>" +
          "<strong>Pulau " + (i + 1) + "</strong>" +
          "<span>" + islandScores[i] + " / " + islandMax + "</span>" +
          "<span>" + getIslandFeedback(islandScores[i], islandMax) + "</span>" +
          "</div>";
      }
      html += "</div>";
      html += "<div class='recap-total'>Total: " + score + " / " + maxScore + " (" + percentScore + "%)<br>Predikat: " + predicate + "</div>";
      return html;
    }

    function getIslandFeedback(value, max) {
      if (value === max) return "Tuntas ✅";
      if (value >= max / 2) return "Cukup baik ⭐";
      return "Perlu latihan 🔁";
    }

    function getPredicate(percentScore) {
      if (percentScore >= 90) return "Penjelajah Aljabar Hebat";
      if (percentScore >= 75) return "Penjelajah Aljabar Tangguh";
      if (percentScore >= 60) return "Penjelajah Aljabar Berkembang";
      return "Terus Berlatih";
    }

    function updateScore() {
      document.getElementById("score").innerText = score;
    }

    function updateProgress(forceComplete) {
      var totalSteps = 0;
      var completedSteps = 0;
      for (var i = 0; i < levels.length; i++) {
        totalSteps += levels[i].steps.length;
        if (i < currentLevel) completedSteps += levels[i].steps.length;
      }
      completedSteps += currentStep;
      if (answered) completedSteps += 1;
      if (forceComplete) completedSteps = totalSteps;
      var percent = Math.round((completedSteps / totalSteps) * 100);
      if (percent > 100) percent = 100;
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressText").innerText = "Kemajuan: " + percent + "%";
    }

    function updateMap(finalState) {
      for (var i = 0; i < levels.length; i++) {
        var dot = document.getElementById("islandDot" + i);
        dot.className = "island-dot";
        if (i < currentLevel || finalState) dot.classList.add("done");
        if (i === currentLevel && !finalState) dot.classList.add("active");
      }
    }

    function restartGame() {
      score = 0;
      currentLevel = 0;
      currentStep = 0;
      answered = false;
      islandScores = [0, 0, 0, 0, 0];
      updateScore();
      renderLevel();
      updateProgress();
    }

    window.onload = initGame;
  </script>
</body>
</html>
